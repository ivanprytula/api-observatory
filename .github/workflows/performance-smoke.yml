name: Performance Smoke

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  authenticated-smoke:
    name: "k6 authenticated API smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_observatory_performance
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_observatory_performance
      CACHE_ENABLED: "false"
      BROKER_ENABLED: "false"
      MONGO_ENABLED: "false"
      OTEL_ENABLED: "false"
      SENTRY_ENABLED: "false"
      ENVIRONMENT: testing
      LOG_FORMAT: json
      BASE_URL: http://127.0.0.1:8000
      VUS: "3"
      DURATION: 20s
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Prepare disposable test identity
        shell: bash
        run: |
          set -euo pipefail
          k6_password="$(openssl rand -hex 16)"
          echo "::add-mask::${k6_password}"
          printf 'K6_USERNAME=k6ci%s\n' "${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          printf 'K6_PASSWORD=%s\n' "${k6_password}" >> "$GITHUB_ENV"

      - name: Start ingestor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/performance-smoke"
          nohup uv run uvicorn services.ingestor.main:app --host 127.0.0.1 --port 8000 \
            > "${RUNNER_TEMP}/performance-smoke/ingestor.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/performance-smoke/ingestor.pid"

      - name: Wait for ingestor health
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl --fail --silent --show-error "${BASE_URL}/health" \
              > "${RUNNER_TEMP}/performance-smoke/health.json"; then
              exit 0
            fi
            sleep 1
          done
          tail -n 200 "${RUNNER_TEMP}/performance-smoke/ingestor.log" || true
          exit 1

      - name: Run k6 smoke and export baseline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${RUNNER_TEMP}/performance-smoke:/artifacts" \
            --env BASE_URL \
            --env K6_USERNAME \
            --env K6_PASSWORD \
            --env VUS \
            --env DURATION \
            grafana/k6:2.0.0 run \
            --summary-export=/artifacts/k6-summary.json \
            /work/scripts/load/k6-ci-smoke.js

      - name: Stop ingestor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pid_file="${RUNNER_TEMP}/performance-smoke/ingestor.pid"
          if [[ -f "${pid_file}" ]]; then
            kill "$(cat "${pid_file}")" || true
          fi

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-smoke
          if-no-files-found: warn
          retention-days: 14
