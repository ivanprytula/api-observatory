name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: "Promote AWS ECR candidates"
    runs-on: ubuntu-latest
    if: vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN_RELEASE != '' && vars.AWS_REGION != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_RELEASE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-release

      - name: Resolve candidate tree SHA
        id: resolve
        uses: ./.github/actions/resolve-tree-sha

      - name: Verify CI passed for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "CI gate (all checks passed)") | .conclusion' \
            | grep -qx 'success' \
            || { echo "The tagged commit must pass CI / CI gate (all checks passed)." >&2; exit 1; }

      - name: Verify all three candidate images exist
        env:
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for service in ingestor inference dashboard; do
            digest=$(aws ecr describe-images \
              --repository-name "api-observatory/${service}" \
              --image-ids imageTag="tree-${TREE_SHA}" \
              --query 'imageDetails[0].imageDigest' --output text)
            [[ -n "${digest}" && "${digest}" != "None" ]] \
              || { echo "Missing candidate for ${service}: tree-${TREE_SHA}" >&2; exit 1; }
            echo "${service}: ${digest}"
          done

      - name: Promote all deployable services without rebuilding
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for service in ingestor inference dashboard; do
            manifest=$(aws ecr batch-get-image \
              --repository-name "api-observatory/${service}" \
              --image-ids imageTag="tree-${TREE_SHA}" \
              --query 'images[0].imageManifest' --output text)
            [[ -n "${manifest}" && "${manifest}" != "None" ]] \
              || { echo "Unable to read candidate manifest for ${service}" >&2; exit 1; }
            aws ecr put-image \
              --repository-name "api-observatory/${service}" \
              --image-tag "${RELEASE_TAG}" \
              --image-manifest "${manifest}" >/dev/null
          done

      - name: Publish release summary
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
        run: |
          {
            echo "## AWS ECR release"
            echo "Candidate tag: tree-${TREE_SHA}"
            echo "Release tag: ${{ github.ref_name }}"
            echo "Registry: ${REGISTRY}"
            echo "Services: ingestor, inference, dashboard"
          } >> "$GITHUB_STEP_SUMMARY"
