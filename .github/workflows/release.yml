name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: "Promote AWS ECR candidates"
    runs-on: ubuntu-latest
    if: vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN_RELEASE != '' && vars.AWS_REGION != ''
    environment: aws-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_RELEASE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-release

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@1629cc33a9521f764a4704d4d0387513918873b9 # v2.1.4

      - name: Resolve candidate tree SHA
        id: resolve
        uses: ./.github/actions/resolve-tree-sha

      - name: Promote all deployable services
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for service in ingestor inference dashboard; do
            source_image="${REGISTRY}/api-observatory/${service}:tree-${TREE_SHA}"
            release_image="${REGISTRY}/api-observatory/${service}:${RELEASE_TAG}"
            docker pull "${source_image}"
            docker tag "${source_image}" "${release_image}"
            docker push "${release_image}"
          done

      - name: Publish release summary
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
        run: |
          {
            echo "## AWS ECR release"
            echo "Candidate tag: tree-${TREE_SHA}"
            echo "Release tag: ${{ github.ref_name }}"
            echo "Registry: ${REGISTRY}"
            echo "Services: ingestor, inference, dashboard"
          } >> "$GITHUB_STEP_SUMMARY"
