name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and tag release image
        run: |
          TREE_SHA=$(git rev-parse HEAD^{tree} | cut -c1-7)
          echo "Pulling candidate image: tree-${TREE_SHA}"
          docker pull "${IMAGE_NAME}:tree-${TREE_SHA}"
          docker tag "${IMAGE_NAME}:tree-${TREE_SHA}" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker tag "${IMAGE_NAME}:tree-${TREE_SHA}" "${IMAGE_NAME}:latest"

      - name: Push release image
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker push "${IMAGE_NAME}:latest"

      - name: Resolve pushed image digest
        id: image-digest
        shell: bash
        run: |
          set -euo pipefail
          repo_digest=$(docker image inspect "${IMAGE_NAME}:${GITHUB_REF_NAME}" --format '{{index .RepoDigests 0}}')
          digest="${repo_digest#*@}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign image with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true

      - name: Verify provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
              --repo "${{ github.repository }}" \
              --cert-identity-regex "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --format json > attestation-verify.json; then
              echo "Provenance attestation verified"
              break
            fi

            if [[ "$attempt" -eq 6 ]]; then
              echo "Failed to verify provenance attestation after retries" >&2
              exit 1
            fi

            echo "Attestation not yet available (attempt ${attempt}/6); retrying in 10s..."
            sleep 10
          done

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.30.0

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft "${IMAGE_NAME}:${GITHUB_REF_NAME}" -o spdx-json > "sbom-${GITHUB_REF_NAME}.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom-${{ github.ref_name }}.spdx.json
