name: Security

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-ref-validation:
    name: Validate action refs are immutable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fail on mutable action refs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ ${#workflow_files[@]} -eq 0 ]; then
            echo "No workflow files found."
            exit 0
          fi
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          if [ -n "$mutable_refs" ]; then
            echo "Mutable GitHub Action references detected. Pin actions to full commit SHAs."
            echo "$mutable_refs"
            exit 1
          fi
          echo "All action references are pinned to immutable SHAs."

  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    needs: action-ref-validation
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Export dependencies for audit
        run: uv export --frozen --all-groups --no-hashes --format requirements-txt > requirements-audit.txt

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt

  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    needs: action-ref-validation
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2

      - name: Analyze
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2

  docker-images:
    name: Docker images (Trivy)
    runs-on: ubuntu-latest
    needs:
      - action-ref-validation
      - python-deps
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - name: ingestor
            path: Dockerfile
          - name: database
            path: infra/database/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            -t "${{ matrix.dockerfile.name }}:${{ github.sha }}" \
            -f "${{ matrix.dockerfile.path }}" \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.dockerfile.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  security-summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs:
      - action-ref-validation
      - python-deps
      - codeql
      - docker-images
    if: always()
    steps:
      - name: Fail if action-ref-validation failed
        if: needs.action-ref-validation.result != 'success'
        run: exit 1

      - name: Fail if python-deps failed
        if: needs.python-deps.result != 'success'
        run: exit 1

      - name: Fail if codeql failed
        if: needs.codeql.result != 'success'
        run: exit 1

      - name: Fail if docker-images failed
        if: needs.docker-images.result != 'success'
        run: exit 1

      - name: Security workflow passed
        run: echo "Security workflow completed successfully."
