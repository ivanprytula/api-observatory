name: Dependabot Age Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-dependabot-pr:
    name: "Check Dependabot PR age on PyPI"
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install requirements
        run: python3 -m pip install --upgrade pip && python3 -m pip install requests

      - name: Run dependabot age gate
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/dependabot_age_gate.py
        continue-on-error: true # advisory mode: findings are reported but do not block the PR

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "## Dependabot Age Guard" >> "$GITHUB_STEP_SUMMARY"
          if [ -f age-gate-report.txt ]; then
            cat age-gate-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Age gate check completed. Review job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
