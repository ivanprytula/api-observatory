name: CD Dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: "Deploy to dev (AWS Fargate)"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: dev
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # TODO: configure AWS credentials (OIDC role assumption, no long-lived keys)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@...
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
      #     aws-region: ${{ vars.AWS_REGION }}

      # TODO: resolve image digest built by CI for this commit
      # TREE_SHA=$(git rev-parse HEAD^{tree} | cut -c1-7)
      # IMAGE="ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor:tree-${TREE_SHA}"

      # TODO: update ECS service (Fargate) with new image digest
      # aws ecs update-service --cluster dev --service ingestor --force-new-deployment

      # TODO: wait for ECS service stability
      # aws ecs wait services-stable --cluster dev --services ingestor

      # TODO: smoke-test /readyz on dev ALB
      # curl --fail https://dev.internal/readyz

      - name: Stub — dev deploy not yet wired
        run: echo "cd-dev stub — extend when AWS Fargate dev environment is provisioned"

      - name: Publish summary
        if: always()
        run: |
          echo "## CD Dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by CI run: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: stub (not yet deployed)" >> "$GITHUB_STEP_SUMMARY"
