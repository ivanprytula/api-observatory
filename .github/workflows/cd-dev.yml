name: CD Dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: data-zoo-dev

jobs:
  deploy-dev:
    name: "Deploy to dev (AWS Fargate)"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: dev
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b #v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse HEAD^{tree} | cut -c1-7)
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ingestor=ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor:tree-${TREE_SHA}" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/${{ github.repository_owner }}/data-zoo-dashboard:tree-${TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy ingestor (ECS Fargate)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.images.outputs.ingestor }}"
          echo "Deploying ingestor: ${IMAGE}"
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service ingestor \
            --force-new-deployment \
            --output text
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services ingestor
          echo "Ingestor stable"

      - name: Deploy dashboard (ECS Fargate)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.images.outputs.dashboard }}"
          echo "Deploying dashboard: ${IMAGE}"
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service dashboard \
            --force-new-deployment \
            --output text
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services dashboard
          echo "Dashboard stable"

      - name: Smoke tests
        env:
          ALB_DNS: ${{ vars.DEV_ALB_DNS }}
        run: |
          set -euo pipefail
          if [ -n "$ALB_DNS" ]; then
            INGESTOR_URL="https://${ALB_DNS}"
            DASHBOARD_URL="https://${ALB_DNS}"
          else
            echo "DEV_ALB_DNS not set — using localhost for smoke tests"
            INGESTOR_URL="http://localhost:8000"
            DASHBOARD_URL="http://localhost:8501"
          fi
          bash scripts/smoke-test.sh "$INGESTOR_URL" "$DASHBOARD_URL"

      - name: Publish summary
        if: always()
        run: |
          echo "## CD Dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by CI run: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ingestor: ${{ steps.images.outputs.ingestor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard: ${{ steps.images.outputs.dashboard }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: deployed" >> "$GITHUB_STEP_SUMMARY"
