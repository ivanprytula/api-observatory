name: Manual CD (AWS EC2)

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  id-token: write

concurrency:
  group: cd-dev-aws
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Build and deploy Stage 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      vars.AWS_CD_ENABLED == 'true' &&
      vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN_DEV != '' &&
      vars.AWS_REGION != '' && vars.AWS_EC2_INSTANCE_ID_DEV != '' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: aws-dev
    outputs:
      tree_sha: ${{ steps.images.outputs.tree_sha }}
      ingestor: ${{ steps.images.outputs.ingestor }}
      inference: ${{ steps.images.outputs.inference }}
      dashboard: ${{ steps.images.outputs.dashboard }}
    env:
      AWS_ROLE_ARN_DEV: ${{ vars.AWS_ROLE_ARN_DEV }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
      AWS_EC2_INSTANCE_ID_DEV: ${{ vars.AWS_EC2_INSTANCE_ID_DEV }}
    steps:
      - name: Checkout selected protected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the selected commit passed all four CI jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for check_name in \
            "Quality" \
            "Unit and contract tests" \
            "PostgreSQL integration and migrations" \
            "Deployable image smoke"; do
            conclusion=$(jq -r --arg name "${check_name}" \
              '[.check_runs[] | select(.name == $name)][0].conclusion // "missing"' \
              <<< "${check_runs}")
            [[ "${conclusion}" == "success" ]] \
              || { echo "CI check '${check_name}' is ${conclusion}." >&2; exit 1; }
          done

      - name: Resolve tree SHA
        id: resolve
        uses: ./.github/actions/resolve-tree-sha

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: api-observatory-manual-cd

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Build and publish immutable images
        id: images
        env:
          REGISTRY: ${{ env.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.resolve.outputs.tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for service in ingestor inference dashboard; do
            case "${service}" in
              ingestor) dockerfile="Dockerfile" ;;
              inference) dockerfile="services/inference/Dockerfile" ;;
              dashboard) dockerfile="services/dashboard/Dockerfile" ;;
            esac
            repository="api-observatory/${service}"
            image="${REGISTRY}/${repository}:tree-${TREE_SHA}"
            docker build --file "${dockerfile}" --tag "${image}" .
            docker push "${image}"
            digest=$(aws ecr describe-images \
              --repository-name "${repository}" \
              --image-ids imageTag="tree-${TREE_SHA}" \
              --query 'imageDetails[0].imageDigest' --output text)
            [[ -n "${digest}" && "${digest}" != "None" ]] \
              || { echo "Missing published digest for ${service}." >&2; exit 1; }
            echo "${service}=${REGISTRY}/${repository}@${digest}" >> "$GITHUB_OUTPUT"
          done
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ env.AWS_EC2_INSTANCE_ID_DEV }}
          TREE_SHA: ${{ steps.images.outputs.tree_sha }}
          INGESTOR_IMAGE: ${{ steps.images.outputs.ingestor }}
          INFERENCE_IMAGE: ${{ steps.images.outputs.inference }}
          DASHBOARD_IMAGE: ${{ steps.images.outputs.dashboard }}
        shell: bash
        run: |
          set -euo pipefail
          rollout_script=$(base64 -w 0 scripts/aws-stage0-rollout.sh)
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"cd /opt/api-observatory\",\"export INGESTOR_IMAGE=${INGESTOR_IMAGE} INFERENCE_IMAGE=${INFERENCE_IMAGE} DASHBOARD_IMAGE=${DASHBOARD_IMAGE} SERVICE_VERSION=tree-${TREE_SHA}\",\"echo ${rollout_script} | base64 -d | bash\"]" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"

  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Publish redacted result
        run: |
          {
            echo "## Manual AWS Stage 0 deployment"
            echo "Selected ref: ${{ github.ref_name }}"
            echo "Status: ${{ needs.deploy.result }}"
            echo "Tree identity: tree-${{ needs.deploy.outputs.tree_sha }}"
            echo "Ingestor: ${{ needs.deploy.outputs.ingestor }}"
            echo "Inference: ${{ needs.deploy.outputs.inference }}"
            echo "Dashboard: ${{ needs.deploy.outputs.dashboard }}"
          } >> "$GITHUB_STEP_SUMMARY"
