name: CD Dev (AWS EC2)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      tree_sha:
        description: "Tree SHA to deploy; leave empty for the current develop tree."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-dev-aws
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  environment-approval:
    name: "Require AWS dev environment approval"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      vars.AWS_CD_ENABLED == 'true' &&
      vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN_DEV != '' &&
      vars.AWS_REGION != '' && vars.AWS_EC2_INSTANCE_ID_DEV != ''
    environment: aws-dev
    steps:
      - name: Approval gate
        run: echo "AWS dev environment approval is required before EC2 deployment."

  deploy-aws-ec2:
    name: "Deploy immutable images to AWS EC2"
    runs-on: ubuntu-latest
    needs: [environment-approval]
    if: needs.environment-approval.result == 'success'
    outputs:
      tree_sha: ${{ steps.images.outputs.tree_sha }}
      ingestor: ${{ steps.images.outputs.ingestor }}
      inference: ${{ steps.images.outputs.inference }}
      dashboard: ${{ steps.images.outputs.dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-cd

      - name: Resolve immutable image references
        id: images
        uses: ./.github/actions/resolve-tree-sha

      - name: Send deployment command through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID_DEV }}
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ inputs.tree_sha || steps.images.outputs.tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          INGESTOR="${REGISTRY}/api-observatory/ingestor:tree-${TREE_SHA}"
          INFERENCE="${REGISTRY}/api-observatory/inference:tree-${TREE_SHA}"
          DASHBOARD="${REGISTRY}/api-observatory/dashboard:tree-${TREE_SHA}"
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"cd /opt/api-observatory\",\"export INGESTOR_IMAGE=${INGESTOR} INFERENCE_IMAGE=${INFERENCE} DASHBOARD_IMAGE=${DASHBOARD} SERVICE_VERSION=tree-${TREE_SHA}\",\"docker compose pull ingestor inference dashboard\",\"docker compose up -d ingestor inference dashboard\",\"curl --fail http://127.0.0.1:8000/health\",\"curl --fail http://127.0.0.1:8001/health\",\"curl --fail http://127.0.0.1:8501/_stcore/health\",\"docker image prune -f --filter until=48h\"]" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          {
            echo "tree_sha=${TREE_SHA}"
            echo "ingestor=${INGESTOR}"
            echo "inference=${INFERENCE}"
            echo "dashboard=${DASHBOARD}"
          } >> "$GITHUB_OUTPUT"

  publish-summary:
    name: "Publish AWS CD summary"
    runs-on: ubuntu-latest
    needs: [environment-approval, deploy-aws-ec2]
    if: always()
    steps:
      - name: Publish summary
        run: |
          {
            echo "## CD Dev (AWS EC2)"
            echo "Status: ${{ needs.deploy-aws-ec2.result }}"
            echo "Deployed version: tree-${{ needs.deploy-aws-ec2.outputs.tree_sha }}"
            echo "Ingestor: ${{ needs.deploy-aws-ec2.outputs.ingestor }}"
            echo "Inference: ${{ needs.deploy-aws-ec2.outputs.inference }}"
            echo "Dashboard: ${{ needs.deploy-aws-ec2.outputs.dashboard }}"
          } >> "$GITHUB_STEP_SUMMARY"
