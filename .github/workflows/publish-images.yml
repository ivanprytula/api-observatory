name: Publish immutable images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: read
      id-token: write
    outputs:
      tree_sha: ${{ steps.tree.outputs.tree_sha }}
      release_metadata: ${{ steps.release.outputs.metadata }}
    if: >-
      vars.AWS_IMAGE_PUBLISH_ENABLED == 'true' &&
      vars.AWS_ECR_REGISTRY != '' && vars.AWS_ECR_PUBLISH_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      github.ref == 'refs/heads/main'
    environment: aws-image-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the selected commit is current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || {
            echo "Only the current main commit may be published." >&2
            exit 1
          }

      - id: tree
        uses: ./.github/actions/resolve-tree-sha

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-image-publish

      - uses: aws-actions/amazon-ecr-login@1629cc33a9521f764a4704d4d0387513918873b9 # v2.1.4

      - id: release
        name: Build images and release metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          TREE_SHA: ${{ steps.tree.outputs.tree_sha }}
        run: |
          set -euo pipefail
          {
            echo "tree_sha=${TREE_SHA}"
            uv run python scripts/ci/publish_release.py \
              --services release/services.json \
              --registry "${REGISTRY}" \
              --commit-sha "${COMMIT_SHA}" \
              --tree-sha "${TREE_SHA}" \
              --summary-file "${GITHUB_STEP_SUMMARY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.sha }}
          path: ${{ steps.release.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: aws-image-publish
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python project
        uses: ./.github/actions/setup-python-project
        with:
          install-args: --frozen --no-dev

      - name: Require promotion token
        env:
          PROMOTION_TOKEN: ${{ secrets.APP_PROMOTION_TOKEN }}
        run: |
          [[ -n "$PROMOTION_TOKEN" ]] || {
            echo "APP_PROMOTION_TOKEN is required; use the release artifact for manual recovery." >&2
            exit 1
          }

      - name: Verify release is still current
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GH_SHA" ]] || {
            echo "A newer main commit superseded this release; skip promotion." >&2
            exit 1
          }

      - name: Promote release into lock
        env:
          RELEASE_METADATA: ${{ needs.publish.outputs.release_metadata }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/promote_release.py \
            --metadata-base64 "$RELEASE_METADATA" \
            --lock environments/aws-dev/images.lock.json

      - name: Open or update promotion PR
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.APP_PROMOTION_TOKEN }}
          add-paths: environments/aws-dev/images.lock.json
          base: main
          branch: automation/promote-aws-dev
          delete-branch: true
          commit-message: "chore: promote aws-dev tree-${{ needs.publish.outputs.tree_sha }}"
          title: "chore: promote aws-dev tree-${{ needs.publish.outputs.tree_sha }}"
          body: |
            Automated promotion of the current CI-green application release into app-owned desired state.

            - Source commit: `${{ github.sha }}`
            - Source tree: `${{ needs.publish.outputs.tree_sha }}`
            - Target: `aws-dev`

            Review the exact lock diff and CI results. Merging this PR approves AWS MVP deployment.
            Optional profiles are preserved from application `main` and change in a separate app PR.
