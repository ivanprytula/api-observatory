name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check services libs

      - name: Ruff format check
        run: uv run ruff format --check services libs

  unit-tests:
    name: Unit tests (sqlite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -q -m unit

  integration-tests:
    name: Integration tests (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: data_zoo_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/data_zoo_test
      REDIS_ENABLED: "true"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify service health before tests
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres

          for _ in {1..30}; do
            if docker exec "${{ job.services.redis.id }}" redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 2
          done
          docker exec "${{ job.services.redis.id }}" redis-cli ping

      - name: Capture dependency diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          docker ps -a > ci-diagnostics/docker-ps.txt
          docker logs "${{ job.services.postgres.id }}" > ci-diagnostics/postgres.log 2>&1 || true
          docker logs "${{ job.services.redis.id }}" > ci-diagnostics/redis.log 2>&1 || true

      - name: Upload dependency diagnostics
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ci-dependency-diagnostics
          path: ci-diagnostics

      - name: Run integration tests with coverage gate
        run: |
          uv run pytest -q -m integration \
            --junitxml=pytest-integration.xml \
            --cov=services/ingestor \
            --cov=libs \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=40

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: pytest-integration-report
          path: pytest-integration.xml

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: integration-coverage-xml
          path: coverage-integration.xml

  observability-gates:
    name: Observability gates (promtool + smoke deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check Prometheus alert rules
        shell: bash
        run: |
          set -euo pipefail
          prom_config=''
          alert_rules=''

          if [[ -f "$PWD/infra/monitoring/prometheus.yml" ]]; then
            prom_config="$PWD/infra/monitoring/prometheus.yml"
          else
            prom_config="$(find "$PWD" \
              -path "$PWD/.venv" -prune -o \
              -path "$PWD/.local-dev" -prune -o \
              -type f -path '*/monitoring/prometheus.yml' -print \
              | head -n 1 || true)"
          fi

          if [[ -f "$PWD/infra/monitoring/rules/alert.rules.yml" ]]; then
            alert_rules="$PWD/infra/monitoring/rules/alert.rules.yml"
          else
            alert_rules="$(find "$PWD" \
              -path "$PWD/.venv" -prune -o \
              -path "$PWD/.local-dev" -prune -o \
              -type f -path '*/monitoring/rules/alert.rules.yml' -print \
              | head -n 1 || true)"
          fi

          if [[ -z "$prom_config" || -z "$alert_rules" ]]; then
            echo "Skipping Prometheus checks: config/rules files are not present in this repository snapshot"
            echo "Discovered monitoring-like files:" >&2
            find "$PWD" \
              -path "$PWD/.venv" -prune -o \
              -path "$PWD/.local-dev" -prune -o \
              -type f \( -name '*prometheus*.yml' -o -name '*alert*.yml' \) -print \
              | sort >&2 || true
            exit 0
          fi

          prom_config_rel="${prom_config#"$PWD"/}"
          alert_rules_rel="${alert_rules#"$PWD"/}"

          docker run --rm \
            --entrypoint=promtool \
            -v "$PWD:/workspace" \
            prom/prometheus:v2.54.1 \
            check config "/workspace/${prom_config_rel}"
          docker run --rm \
            --entrypoint=promtool \
            -v "$PWD:/workspace" \
            prom/prometheus:v2.54.1 \
            check rules "/workspace/${alert_rules_rel}"

      - name: Smoke deploy prod-like stack
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$PWD/scripts/ops/02-compose-profile.sh" ]]; then
            echo "Skipping smoke deploy: scripts/ops/02-compose-profile.sh is not present in this repository snapshot"
            exit 0
          fi

          bash scripts/ops/02-compose-profile.sh prod-like up -d db redis redpanda ingestor
          trap 'bash scripts/ops/02-compose-profile.sh prod-like down -v' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:8000/readyz >/dev/null; then
              echo "smoke deploy passed"
              exit 0
            fi
            sleep 5
          done

          echo "smoke deploy failed" >&2
          bash scripts/ops/02-compose-profile.sh prod-like logs ingestor
          exit 1

  docker-build-push:
    name: Build and push candidate image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          TREE_SHA=$(git rev-parse HEAD^{tree} | cut -c1-7)
          echo "TREE_SHA=${TREE_SHA}" >> "$GITHUB_ENV"
          docker build -t ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor:tree-${TREE_SHA} -f Dockerfile .
          docker tag ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor:tree-${TREE_SHA} data-zoo/ingestor:ci

      - name: Push candidate image
        run: docker push ghcr.io/${{ github.repository_owner }}/data-zoo-ingestor:tree-${TREE_SHA}

      - name: Check image size (MB)
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(docker image inspect data-zoo/ingestor:ci --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "Image size: ${mb} MB"
          echo "docker_image_size_mb=${mb}" >> "$GITHUB_STEP_SUMMARY"
