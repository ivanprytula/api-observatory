name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: "Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate workspace and service boundaries
        run: |
          python3 scripts/ci/check_workspace_manifests.py
          python3 scripts/ci/check_service_boundaries.py
          python3 scripts/validate_aws_deployment_contract.py

      - name: Validate workflow action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          mutable_docker_refs=$(grep -nE 'uses:\s*docker://' "${workflow_files[@]}" | grep -v '@sha256:' || true)
          if [[ -n "${mutable_refs}" || -n "${mutable_docker_refs}" ]]; then
            echo "Mutable action reference detected."
            echo "${mutable_refs}"
            echo "${mutable_docker_refs}"
            exit 1
          fi

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Lint, format, docs, and type checks
        run: |
          uv run ruff check services libs scripts tests
          uv run ruff format --check services libs scripts tests
          uv run python scripts/ci/docs_quality_check.py
          uv run ty check \
            libs/platform \
            services/dashboard/core \
            services/dashboard/ui \
            services/ingestor/auth.py \
            services/ingestor/cache.py \
            services/ingestor/main.py \
            services/ingestor/pubsub.py \
            services/ingestor/repositories/etl.py \
            services/ingestor/routers/mongo_analytics.py \
            services/ingestor/routers/scraper.py \
            services/ingestor/scrapers \
            services/ingestor/storage/minios3.py \
            services/ingestor/transformations/tabular.py \
            services/mcp/main.py

      - name: Detect committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2
        with:
          args: detect --source=/github/workspace --verbose --no-banner

  unit:
    name: "Unit and contract tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_TEST: "sqlite+aiosqlite:///:memory:"
      CACHE_ENABLED: "false"
      DOCS_USERNAME: ""
      DOCS_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit and OpenAPI contract tests
        run: |
          uv run pytest -q -m unit
          uv run pytest services/ingestor/tests/contract -q -m contract --no-cov

  integration:
    name: "PostgreSQL integration and migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_obs_ingestor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      cache:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_test
      CACHE_ENABLED: "true"
      CACHE_URL: redis://localhost:6379/0
      AUTH_DEMO_ROUTES_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync workspace
        run: uv sync --frozen --all-packages

      - name: Create isolated migration and inference databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_ingestor_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_test

      - name: Validate ingestor migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic check

      - name: Validate inference migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_migrations
        run: |
          uv run alembic -c services/inference/alembic.ini upgrade head
          uv run alembic -c services/inference/alembic.ini current --check-heads
          uv run alembic -c services/inference/alembic.ini check

      - name: Run ingestor integration tests
        run: |
          mkdir -p coverage
          uv run pytest -q -m integration \
            --cov=services/ingestor \
            --cov=libs \
            --cov-report=term-missing \
            --cov-report=xml:coverage/ingestor.xml \
            --cov-fail-under=40

      - name: Run inference integration tests
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_test
        run: |
          uv run pytest services/inference/tests -q -o addopts='' \
            --cov-config=coverage.inference.ini \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage/inference.xml \
            --cov-fail-under=85

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: coverage
          if-no-files-found: error

  image-smoke:
    name: "Deployable image smoke"
    runs-on: ubuntu-latest
    needs: [quality, unit, integration]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and health-check the Stage 0 images
        run: scripts/ci/smoke-deployable-images.sh
