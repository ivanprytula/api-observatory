name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      delivery: ${{ steps.filter.outputs.delivery }}
      docs: ${{ steps.filter.outputs.docs }}
      deployable_images: ${{ steps.filter.outputs.deployable_images }}
      aws_mvp_lock: ${{ steps.filter.outputs.aws_mvp_lock }}
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: --frozen --all-packages --all-extras

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'services/**'
              - 'libs/**'
              - 'tests/**'
              - 'alembic/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'release/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
              - '.github/workflows/assurance.yml'
            delivery:
              - 'deployment/aws-mvp/**'
              - 'environments/aws-dev/images.lock.json'
              - 'scripts/promote_mvp_images.py'
              - 'scripts/validate_mvp_contract.py'
              - 'tests/unit/test_aws_mvp_delivery_contract.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
              - '.github/workflows/deploy-aws-mvp.yml'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
              - '.github/workflows/assurance.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            deployable_images:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic.ini'
              - 'alembic/**'
              - 'release/services.json'
              - '!services/mcp/**'
            aws_mvp_lock:
              - 'environments/aws-dev/images.lock.json'

  code-quality:
    name: "Code quality"
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' || needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: --frozen --all-packages --all-extras

      - name: Validate workspace and service boundaries
        run: |
          uv run python scripts/ci/check_workspace_manifests.py
          uv run python scripts/ci/check_service_boundaries.py
          uv run python scripts/validate_release_manifest.py
          uv run python scripts/validate_mvp_contract.py --allow-placeholder-lock --app-root .

      - name: Validate workflow action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          mutable_docker_refs=$(grep -nE 'uses:\s*docker://' "${workflow_files[@]}" | grep -v '@sha256:' || true)
          if [[ -n "${mutable_refs}" || -n "${mutable_docker_refs}" ]]; then
            echo "Mutable action reference detected."
            echo "${mutable_refs}"
            echo "${mutable_docker_refs}"
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b # v0.1.3 (upstream actionlint v1.7.12)

      - name: Lint, format, and type checks
        run: |
          uv run ruff check services libs scripts tests
          uv run ruff format --check services libs scripts tests
          uv run bandit -c pyproject.toml -r services libs scripts
          uv run python scripts/ci/check_test_markers.py
          uv run ty check services libs

      - name: Detect committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2
        with:
          args: detect --source=/github/workspace --verbose --no-banner

  docs-quality:
    name: "Docs quality"
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: --frozen --all-packages --all-extras

      - name: Validate workflow action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          mutable_docker_refs=$(grep -nE 'uses:\s*docker://' "${workflow_files[@]}" | grep -v '@sha256:' || true)
          if [[ -n "${mutable_refs}" || -n "${mutable_docker_refs}" ]]; then
            echo "Mutable action reference detected."
            echo "${mutable_refs}"
            echo "${mutable_docker_refs}"
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b # v0.1.3 (upstream actionlint v1.7.12)

      - name: Lint markdown documentation
        run: uv run python scripts/ci/docs_quality_check.py

  unit:
    name: "Unit and contract tests"
    needs: [changes]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_TEST: "sqlite+aiosqlite:///:memory:"
      CACHE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: >-
            --frozen --all-packages
            --extra ai --extra messaging --extra etl

      - name: Run unit, MCP, and OpenAPI contract tests
        run: |
          uv run pytest tests/unit services/ingestor/tests/unit -q -m unit
          uv run pytest services/mcp/tests -q --no-cov
          uv run pytest services/ingestor/tests/contract -q -m contract --no-cov

  integration:
    name: "Core PostgreSQL integration and migrations"
    needs: [changes, code-quality, unit]
    if: >-
      needs.changes.outputs.app == 'true' &&
      always() &&
      needs.code-quality.result == 'success' &&
      needs.unit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_obs_ingestor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_test
      CACHE_ENABLED: "false"
      AUTH_DEMO_ROUTES_ENABLED: "false"
      BROKER_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "false"
      RLS_ENABLED: "false"
      OPENAI_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      OTEL_ENABLED: "false"
      BACKGROUND_WORKERS_ENABLED: "false"
      RETENTION_ENABLED: "false"
      CORE_TEST_MARKER: >-
        integration and not capability_rls and not capability_broker and not
        capability_ai and not full_optional
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: >-
            --frozen --all-packages
            --extra ai --extra messaging --extra etl

      - name: Create isolated migration and inference databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_ingestor_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_test

      - name: Validate ingestor migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_migrations
        run: uv run python scripts/ci/validate_migrations.py "$DATABASE_URL"

      - name: Validate inference migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_migrations
        run: uv run python scripts/ci/validate_migrations.py "$DATABASE_URL" --alembic-config services/inference/alembic.ini

      - name: Run core ingestor integration tests
        run: |
          mkdir -p coverage
          uv run pytest -q -m "${CORE_TEST_MARKER}" \
            --cov-report=xml:coverage/ingestor.xml

      - name: Run inference integration tests
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_test
        run: |
          uv run pytest services/inference/tests -q -o addopts='' \
            --cov-config=coverage.inference.ini \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage/inference.xml

  capability:
    name: "Capability: ${{ matrix.profile }}"
    needs: [changes, code-quality, unit]
    if: >-
      needs.changes.outputs.app == 'true' &&
      always() &&
      needs.code-quality.result == 'success' &&
      needs.unit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rls
            marker: capability_rls
            rls_enabled: "true"
            broker_enabled: "false"
            notifications_enabled: "false"
          - profile: broker
            marker: capability_broker
            rls_enabled: "false"
            broker_enabled: "true"
            notifications_enabled: "true"
          - profile: ai
            marker: capability_ai
            rls_enabled: "false"
            broker_enabled: "false"
            notifications_enabled: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_obs_ingestor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_test
      CACHE_ENABLED: "false"
      AUTH_DEMO_ROUTES_ENABLED: "false"
      OTEL_ENABLED: "false"
      BACKGROUND_WORKERS_ENABLED: "false"
      RETENTION_ENABLED: "false"
      OPENAI_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      RLS_ENABLED: ${{ matrix.rls_enabled }}
      BROKER_ENABLED: ${{ matrix.broker_enabled }}
      NOTIFICATIONS_ENABLED: ${{ matrix.notifications_enabled }}
      NOTIFICATION_DELIVERY_MODE: broker
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: >-
            --frozen --all-packages
            --extra ai --extra messaging --extra etl

      - name: Run capability profile
        run: |
          uv run pytest services/ingestor/tests -q -m "${{ matrix.marker }}"

  image-smoke:
    name: "Deployable image smoke"
    runs-on: ubuntu-latest
    needs: [changes, code-quality, unit, integration]
    if: >-
      needs.changes.outputs.app == 'true' &&
      needs.changes.outputs.deployable_images == 'true' &&
      always() &&
      needs.code-quality.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and health-check MVP workload images
        run: scripts/ci/smoke-deployable-images.sh

  publish-images:
    name: "Publish immutable images"
    needs: [changes, code-quality, docs-quality, unit, integration, image-smoke]
    if: >-
      always() &&
      needs.changes.outputs.app == 'true' &&
      needs.changes.outputs.deployable_images == 'true' &&
      needs.code-quality.result == 'success' &&
      (needs.docs-quality.result == 'success' || needs.docs-quality.result == 'skipped') &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.image-smoke.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      checks: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-images.yml
    secrets: inherit

  deploy-aws-mvp:
    name: Deploy AWS MVP desired state
    needs: [changes, code-quality, docs-quality, unit, integration, image-smoke]
    if: >-
      always() &&
      needs.changes.outputs.aws_mvp_lock == 'true' &&
      (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped') &&
      (needs.docs-quality.result == 'success' || needs.docs-quality.result == 'skipped') &&
      (needs.unit.result == 'success' || needs.unit.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      (needs.image-smoke.result == 'success' || needs.image-smoke.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      checks: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws-mvp.yml
