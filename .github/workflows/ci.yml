name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check services libs

      - name: Ruff format check
        run: uv run ruff format --check services libs

  unit-tests:
    name: Unit tests (sqlite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -q -m unit

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t data-zoo/ingestor:ci -f Dockerfile .

      - name: Check image size (MB)
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(docker image inspect data-zoo/ingestor:ci --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "Image size: ${mb} MB"
          echo "docker_image_size_mb=${mb}" >> "$GITHUB_STEP_SUMMARY"
