name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      delivery: ${{ steps.filter.outputs.delivery }}
      docs: ${{ steps.filter.outputs.docs }}
      deployable_images: ${{ steps.filter.outputs.deployable_images }}
      aws_mvp_lock: ${{ steps.filter.outputs.aws_mvp_lock }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=2 origin "$base" "$head" >/dev/null 2>&1 || true
            changed_files=$(git diff --name-only "$base" "$head")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$head")
          fi
          echo "$changed_files"
          app_paths_regex='^(services/|libs/|tests/|alembic/|scripts/|pyproject.toml|uv.lock|'
          app_paths_regex+='\.python-version|Dockerfile|docker-compose[^/]*\.yml|release/'
          app_paths_regex+='|\.github/workflows/(ci|publish-images|assurance)\.yml)'
          if echo "$changed_files" | grep -Eq "$app_paths_regex"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          delivery_paths_regex='^(deployment/aws-mvp/|environments/aws-dev/images\.lock\.json|'
          delivery_paths_regex+='scripts/(promote_mvp_images|validate_mvp_contract)\.py|'
          delivery_paths_regex+='tests/unit/test_aws_mvp_delivery_contract\.py|'
          delivery_paths_regex+='\.github/workflows/(ci|publish-images|deploy-aws-mvp)\.yml)'
          if echo "$changed_files" | grep -Eq "$delivery_paths_regex"; then
            echo "delivery=true" >> "$GITHUB_OUTPUT"
          else
            echo "delivery=false" >> "$GITHUB_OUTPUT"
          fi
          docs_paths_regex='^(docs/|README\.md|CONTRIBUTING\.md|\.github/workflows/ci\.yml|'
          docs_paths_regex+='\.github/workflows/publish-images\.yml|\.github/workflows/assurance\.yml|'
          docs_paths_regex+='pyproject\.toml|uv\.lock|\.python-version)'
          if echo "$changed_files" | grep -Eq "$docs_paths_regex"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          deployable_paths_regex='^(\.dockerignore|Dockerfile|pyproject\.toml|uv\.lock|alembic\.ini|alembic/'
          deployable_paths_regex+='|libs/|release/services\.json|services/)'
          deployable_files=$(echo "$changed_files" | grep -Ev '^services/mcp/' || true)
          if echo "$deployable_files" | grep -Eq "$deployable_paths_regex"; then
            echo "deployable_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable_images=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed_files" | grep -Fxq 'environments/aws-dev/images.lock.json'; then
            echo "aws_mvp_lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws_mvp_lock=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: "Quality"
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' || needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Validate workspace and service boundaries
        run: |
          uv run python scripts/ci/check_workspace_manifests.py
          uv run python scripts/ci/check_service_boundaries.py
          uv run python scripts/validate_release_manifest.py
          uv run python scripts/validate_mvp_contract.py --allow-placeholder-lock --app-root .

      - name: Validate workflow action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          mutable_docker_refs=$(grep -nE 'uses:\s*docker://' "${workflow_files[@]}" | grep -v '@sha256:' || true)
          if [[ -n "${mutable_refs}" || -n "${mutable_docker_refs}" ]]; then
            echo "Mutable action reference detected."
            echo "${mutable_refs}"
            echo "${mutable_docker_refs}"
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b # v0.1.3 (upstream actionlint v1.7.12)

      - name: Lint, format, docs, and type checks
        run: |
          uv run ruff check services libs scripts tests
          uv run ruff format --check services libs scripts tests
          uv run bandit -c pyproject.toml -r services libs scripts
          uv run python scripts/ci/check_test_markers.py
          uv run python scripts/ci/docs_quality_check.py
          uv run ty check services libs

      - name: Detect committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2
        with:
          args: detect --source=/github/workspace --verbose --no-banner

  unit:
    name: "Unit and contract tests"
    needs: [changes]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_TEST: "sqlite+aiosqlite:///:memory:"
      CACHE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --all-packages --extra ai --extra messaging --extra etl

      - name: Run unit, MCP, and OpenAPI contract tests
        run: |
          mkdir -p coverage
          COVERAGE_FILE=coverage/.coverage.unit \
            uv run pytest tests/unit services/ingestor/tests/unit -q -m unit
          uv run pytest services/mcp/tests -q --no-cov
          uv run pytest services/ingestor/tests/contract -q -m contract --no-cov

      - name: Upload ingestor unit coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingestor-unit-coverage-data
          path: coverage/.coverage.unit
          if-no-files-found: error

  integration:
    name: "Core PostgreSQL integration and migrations"
    needs: [changes, unit]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_obs_ingestor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_test
      CACHE_ENABLED: "false"
      AUTH_DEMO_ROUTES_ENABLED: "false"
      BROKER_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "false"
      RLS_ENABLED: "false"
      OPENAI_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      OTEL_ENABLED: "false"
      BACKGROUND_WORKERS_ENABLED: "false"
      RETENTION_ENABLED: "false"
      CORE_TEST_MARKER: >-
        integration and not capability_rls and not capability_broker and not
        capability_ai and not full_optional
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --frozen --all-packages --extra ai --extra messaging --extra etl

      - name: Download ingestor unit coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ingestor-unit-coverage-data
          path: coverage

      - name: Create isolated migration and inference databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_ingestor_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_migrations
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres api_obs_inference_test

      - name: Validate ingestor migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic check

      - name: Validate inference migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_migrations
        run: |
          uv run alembic -c services/inference/alembic.ini upgrade head
          uv run alembic -c services/inference/alembic.ini current --check-heads
          uv run alembic -c services/inference/alembic.ini check

      - name: Run core ingestor integration tests
        run: |
          mkdir -p coverage
          COVERAGE_FILE=coverage/.coverage.core \
            uv run pytest -q -m "${CORE_TEST_MARKER}" \
            --cov=services/ingestor \
            --cov-report=term-missing

      - name: Combine and report ingestor coverage
        run: |
          uv run coverage combine --keep coverage/.coverage.unit coverage/.coverage.core
          uv run coverage report
          uv run coverage xml -o coverage/ingestor.xml

      - name: Run inference integration tests
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_inference_test
        run: |
          uv run pytest services/inference/tests -q -o addopts='' \
            --cov-config=coverage.inference.ini \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage/inference.xml

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-integration-coverage
          path: coverage
          if-no-files-found: error

  capability:
    name: "Capability: ${{ matrix.profile }}"
    needs: [changes, unit]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rls
            marker: capability_rls
            rls_enabled: "true"
            broker_enabled: "false"
            notifications_enabled: "false"
          - profile: broker
            marker: capability_broker
            rls_enabled: "false"
            broker_enabled: "true"
            notifications_enabled: "true"
          - profile: ai
            marker: capability_ai
            rls_enabled: "false"
            broker_enabled: "false"
            notifications_enabled: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: api_obs_ingestor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/api_obs_ingestor_test
      CACHE_ENABLED: "false"
      AUTH_DEMO_ROUTES_ENABLED: "false"
      OTEL_ENABLED: "false"
      BACKGROUND_WORKERS_ENABLED: "false"
      RETENTION_ENABLED: "false"
      OPENAI_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      RLS_ENABLED: ${{ matrix.rls_enabled }}
      BROKER_ENABLED: ${{ matrix.broker_enabled }}
      NOTIFICATIONS_ENABLED: ${{ matrix.notifications_enabled }}
      NOTIFICATION_DELIVERY_MODE: broker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --frozen --all-packages --extra ai --extra messaging --extra etl

      - name: Run capability profile
        run: |
          mkdir -p coverage
          COVERAGE_FILE=coverage/.coverage.${{ matrix.profile }} \
            uv run pytest services/ingestor/tests -q -m "${{ matrix.marker }}" \
            --cov=services/ingestor --cov-report=term-missing

      - name: Publish capability coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-${{ matrix.profile }}-coverage
          path: coverage
          if-no-files-found: error

  image-smoke:
    name: "Deployable image smoke"
    runs-on: ubuntu-latest
    needs: [changes, quality, unit, integration]
    if: >-
      needs.changes.outputs.app == 'true' &&
      needs.changes.outputs.deployable_images == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and health-check MVP workload images
        run: scripts/ci/smoke-deployable-images.sh

  merge-gate:
    name: "Merge gate"
    runs-on: ubuntu-latest
    if: >-
      always() && (needs.changes.outputs.app == 'true' || needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.delivery == 'true')
    needs: [changes, quality, unit, integration, image-smoke]
    steps:
      - name: Require every application CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          IMAGE_SMOKE_RESULT: ${{ needs.image-smoke.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$IMAGE_SMOKE_RESULT"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done

  publish-images:
    name: "Publish immutable images"
    needs: [changes, merge-gate]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployable_images == 'true' &&
      needs.merge-gate.result == 'success'
    permissions:
      checks: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-images.yml
    secrets: inherit

  deploy-aws-mvp:
    name: Deploy AWS MVP desired state
    needs: [changes, merge-gate]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.aws_mvp_lock == 'true' &&
      needs.merge-gate.result == 'success'
    permissions:
      checks: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws-mvp.yml
