name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zizmor
        run: pip install zizmor
      - name: Run zizmor
        run: zizmor scan . --format sarif > zizmor.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
