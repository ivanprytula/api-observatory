name: Deploy AWS MVP desired state

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read
      id-token: write
    if: >-
      vars.AWS_CD_ENABLED == 'true' && vars.AWS_ECR_REGISTRY != '' &&
      vars.AWS_APP_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' &&
      vars.AWS_EC2_INSTANCE_ID_DEV != ''
    environment: aws-dev
    env:
      MVP_PLATFORM_CONTRACT_VERSION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python project
        uses: ./.github/actions/setup-python-project
        with:
          install-args: --frozen --no-dev

      - name: Require a CI-green current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'AWS MVP deployment accepts only main.' >&2
            exit 1
          }
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'Only the current main desired state may be deployed.' >&2
            exit 1
          }

      - id: app-ref
        name: Resolve the committed application source identity
        run: |
          set -euo pipefail
          uv run python scripts/ci/deploy_mvp.py resolve-ref \
            --lock environments/aws-dev/images.lock.json
          ref=$(grep '^ref=' "$GITHUB_OUTPUT" | cut -d= -f2)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out the exact image source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .mvp-release
          ref: ${{ steps.app-ref.outputs.ref }}

      - name: Validate the application MVP workload contract
        run: uv run python scripts/validate_mvp_contract.py --app-root .mvp-release

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-app-deploy

      - name: Build SSM deployment payload
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID_DEV }}
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/deploy_mvp.py build-ssm-payload \
            --lock environments/aws-dev/images.lock.json \
            --registry "${REGISTRY}" \
            --instance-id "${INSTANCE_ID}" \
            --contract-version "${MVP_PLATFORM_CONTRACT_VERSION}" \
            --compose deployment/aws-mvp/docker-compose.yml \
            --prometheus deployment/aws-mvp/prometheus.yml \
            --rollout deployment/aws-mvp/rollout.sh \
            --output "${RUNNER_TEMP}/ssm-payload.json"

      - name: Deploy committed desired state through SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID_DEV }}
        run: |
          set -euo pipefail
          parameters="$(jq -c . "${RUNNER_TEMP}/ssm-payload.json")"
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${INSTANCE_ID}"
