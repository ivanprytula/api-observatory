name: Optional integration journey

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-optional:
    name: "Deterministic full optional flow"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python project
        uses: ./.github/actions/setup-python-project
        with:
          install-args: >-
            --frozen --all-packages
            --extra ai --extra messaging --extra etl

      - name: Run deterministic composed flow
        run: env RLS_ENABLED=true BROKER_ENABLED=true NOTIFICATIONS_ENABLED=true NOTIFICATION_DELIVERY_MODE=broker ANTHROPIC_ENABLED=false uv run --extra ai --extra messaging pytest services/ingestor/tests/integration/test_full_optional_flow.py -q

      - name: Run WebSocket Lab tests
        run: uv run pytest services/ingestor/tests -q -m ws_lab

      - name: Publish composed-flow coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-optional-coverage
          path: htmlcov
          if-no-files-found: ignore
