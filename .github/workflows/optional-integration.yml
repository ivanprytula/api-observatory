name: Optional integration journey

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-optional:
    name: "Deterministic full optional flow"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: ./.github/actions/setup-python-project
        with:
          fetch-depth: 1
          install-args: >-
            --frozen --all-packages
            --extra ai --extra messaging --extra etl

      - name: Run deterministic composed flow
        run: just test-full-optional

      - name: Publish composed-flow coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-optional-coverage
          path: htmlcov
          if-no-files-found: ignore
