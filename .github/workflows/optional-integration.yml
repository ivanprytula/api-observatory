name: Optional integration journey

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-optional:
    name: "Deterministic full optional flow"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync optional capabilities
        run: uv sync --frozen --all-packages --extra ai --extra messaging --extra etl

      - name: Run deterministic composed flow
        run: just test-full-optional

      - name: Publish composed-flow coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-optional-coverage
          path: htmlcov
          if-no-files-found: ignore
