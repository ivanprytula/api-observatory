name: "Setup Python project"
description: "Set up uv and sync dependencies."
inputs:
  install-args:
    description: "Extra arguments for uv sync"
    required: false
    default: "--frozen --all-packages"
runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Sync dependencies
      shell: bash
      run: uv sync ${{ inputs.install-args }}
