name: "Resolve tree SHA"
description: >-
  Compute the deterministic per-commit tree SHA used for image tags
  (tree-<sha>). Requires the repo to already be checked out.
outputs:
  tree_sha:
    description: "Full Git tree SHA"
    value: ${{ steps.resolve.outputs.tree_sha }}
runs:
  using: "composite"
  steps:
    - id: resolve
      shell: bash
      run: |
        set -euo pipefail
        TREE_SHA=$(git rev-parse HEAD^{tree})
        echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
