# Disposable CI topology for the three MVP workload images. It has no host ports,
# volumes, secrets, or cloud dependencies; `docker compose ... down --volumes`
# removes all state after the smoke check.
services:
  ingestor-db:
    image: dhi.io/pgvector:0.8-pg17-debian13@sha256:d91ee73792106b6d657af8803a12670b871c8ef9bc70516d853867a53f941734
    environment:
      POSTGRES_DB: api_obs_ingestor
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']

  inference-db:
    image: dhi.io/pgvector:0.8-pg17-debian13@sha256:d91ee73792106b6d657af8803a12670b871c8ef9bc70516d853867a53f941734
    environment:
      POSTGRES_DB: api_obs_inference
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-obs/ingestor:ci-smoke
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn services.ingestor.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      BROKER_ENABLED: 'false'
      CACHE_ENABLED: 'false'
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@ingestor-db:5432/api_obs_ingestor
      INFERENCE_URL: http://inference:8001
      JWT_SECRET: image-smoke-jwt-secret-not-for-production
      MONGO_ENABLED: 'false'
      OTEL_ENABLED: 'false'
      SENTRY_ENABLED: 'false'
    depends_on:
      ingestor-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3)']

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    image: api-obs/inference:ci-smoke
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn services.inference.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@inference-db:5432/api_obs_inference
      OTEL_ENABLED: 'false'
    depends_on:
      inference-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/readyz", timeout=3)']

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    image: api-obs/dashboard:ci-smoke
    environment:
      INFERENCE_URL: http://inference:8001
      INGESTOR_URL: http://ingestor:8000
    depends_on:
      ingestor:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=3)']
