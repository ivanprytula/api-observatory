[project]
name = "inference"
version = "0.1.0"
description = "Embeddings indexing + semantic search service (pgvector-backed RAG for API Observatory)"
requires-python = ">=3.14"
authors = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
maintainers = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.139.0",
  "prometheus-fastapi-instrumentator>=8.0.2",
  "uvicorn[standard]>=0.51.0",
  "sqlalchemy[asyncio]>=2.0.50",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.3.4",
  "pgvector>=0.3.6",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.2",
  "opentelemetry-sdk>=1.43.0",
  "opentelemetry-instrumentation-fastapi>=0.64b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
  "opentelemetry-exporter-otlp>=1.43.0",
  # ONNX Runtime-based, CPU-only by design, no torch/CUDA — fits a free-tier VM.
  "fastembed>=0.5.1",
  "alembic>=1.18.5",
]
