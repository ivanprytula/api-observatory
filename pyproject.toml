[project]
name = "api-observatory"
version = "0.1.0"
requires-python = ">=3.14"
authors = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
maintainers = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.51.0",
  "slowapi>=0.1.10",
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.3.4",
  "pydantic[email]>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-json-logger>=4.1.0",
  "structlog>=24.4.0",
  "pyjwt>=2.10.0",
  "argon2-cffi>=23.1.0",
  "alembic>=1.19.1",
  "httpx>=0.28.1",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "redis>=8.1.0",
  "apscheduler>=3.11.3,<4.0",
  "websockets>=14.0",
  "python-multipart>=0.0.27",
  "pycasbin>=2.8.0",
  "casbin-sqlalchemy-adapter>=1.4.0",
]
description = "API observability platform — multi-service system for monitoring API reliability, drift detection, semantic search, and scorecard reporting"
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICEN[CS]E.*",
]
keywords = [
  "api",
  "observatory",
  "async",
  "ivan-prytula",
]


[project.optional-dependencies]
tracing = [
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.64b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
  "opentelemetry-exporter-otlp>=1.43.0",
]
messaging = [
  "aiokafka>=0.11",
]
ai = [
  "openai>=2.53.0",
  "anthropic>=0.121.0",
  "langgraph>=1.2.10",
  "langgraph-checkpoint-postgres>=3.1.2",
  "langchain-anthropic>=1.5.4",
  "pgvector>=0.3.0",
]
etl = [
  "pandas>=3.0.5",
  "polars[rtcompat]>=1.30.0",
]
monitoring = [
  "sentry-sdk[fastapi]>=2.19.2",
]
http = [
  "aiohttp>=3.14.3",
]
mcp = [
  "fastmcp>=0.4.0",
]
full = [
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.64b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
  "opentelemetry-exporter-otlp>=1.43.0",
  "aiokafka>=0.11",
  "openai>=2.53.0",
  "anthropic>=0.121.0",
  "langgraph>=1.2.10",
  "langgraph-checkpoint-postgres>=3.1.2",
  "langchain-anthropic>=1.5.4",
  "pandas>=3.0.5",
  "polars[rtcompat]>=1.30.0",
  "sentry-sdk[fastapi]>=2.19.2",
  "aiohttp>=3.14.3",
  "pgvector>=0.3.0",
  "fastmcp>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ivanprytula/api-observatory"
Repository = "https://github.com/ivanprytula/api-observatory"
Issues = "https://github.com/ivanprytula/api-observatory/issues"
LinkedIn = "https://linkedin.com/in/ivanprytula"

[tool.uv]
environments = [
  "sys_platform == 'linux'",
]
constraint-dependencies = [
  "msgpack>=1.2.1",
]

[tool.uv.workspace]
members = [
  "services/ingestor",
  "services/dashboard",
  "services/inference",
  "services/mcp",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.1.0",
  # respx: mocks httpx.AsyncClient at the transport level, used by services/mcp/tests/
  "respx>=0.22.0",
  # testcontainers: auto-provision postgres:17-bookworm for local integration tests
  # (Docker must be running; CI uses GHA service container instead)
  "testcontainers[postgres,redis]>=4.14.2",
  "pygments>=2.20.0",
  "httpx>=0.28.1",
  "aiosqlite>=0.20.0",                      # async SQLite for tests (no real PG needed)
  "fakeredis>=2.37.0",                      # in-memory redis for tests
  # Pre-commit hooks & linting
  "pre-commit>=4.6.1",
  "bandit[toml]>=1.9.4",
  "ruff>=0.16.2",
  # Load testing
  "locust>=2.46.3",
  # k6 is a standalone CLI, install via:
  #   - Linux: sudo apt install k6
  #   - macOS: brew install grafana/k6/k6
  #   - or: https://k6.io/docs/getting-started/installation/
  "ty>=0.0.69",
  "pip-audit>=2.10.1",
  "schemathesis>=4.24.3,<5",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "services/ingestor/tests",
]
asyncio_mode = "auto"
# Limit coverage collection to the package under test to avoid "module X was never imported" warnings
addopts = "--cov=services/ingestor --cov-report=term-missing --cov-report=html -q -m 'not e2e and not demo'"
filterwarnings = [
  "ignore::DeprecationWarning:slowapi",
  "ignore::DeprecationWarning:fastapi.routing",
]
markers = [
  "unit: Fast, isolated unit tests (no I/O, no DB)",
  "integration: Tests that touch DB/ASGI client",
  "core: Baseline application behavior with optional capabilities disabled",
  "capability_rls: PostgreSQL tenant row-level-security capability",
  "capability_broker: Broker-mode notification outbox, inbox, and delivery capability",
  "capability_ai: Deterministic incident-triage AI capability",
  "full_optional: Composed deterministic RLS, broker-delivery, and AI handoff flow",
  "demo: Demo/learning feature tests (v2 routes, session auth examples)",
  "contract: In-process OpenAPI contract tests (no external services)",
  "e2e: End-to-end or long-running tests (skipped by default)",
  "chaos: destructive local fault-injection tests run only through the lab workflow",
  "browser: Browser-based tests using Playwright (may require system dependencies)",
  "live: Manual checks that call a public third-party service; never run in CI",
  "mongo: MongoDB-dependent tests (skipped if MongoDB unavailable)",
  "ws_lab: WebSocket pub/sub consumer (Lab)",
]


[tool.coverage.run]
source = [
  "services.ingestor",
]
omit = [
  "services/ingestor/__main__.py",
  "*/services/ingestor/tests/*",
  "*/migrations/*",
  "*/alembic/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
# Keep formatter output compatible with the CI boundary parser. Ruff's py314
# formatter emits the unparenthesized multi-exception syntax from PEP 758.
target-version = "py313"
extend-exclude = [
  "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # "SIM117",
  "B008",
] # Allow nested with statements and Depends() in defaults (FastAPI pattern)

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 100

[[tool.ty.overrides]]
include = [
  "tests",
  "services/*/tests",
  "labs",
  "services/inference/**",
  "services/mcp/**",
  "services/dashboard/**",
]

[tool.ty.overrides.rules]
# Tests and learning labs intentionally use dynamic fixtures, optional extras, and mocks.
# Inference and MCP services depend on optional packages (pgvector, fastmcp) that may
# not be installed in every environment.
# Dashboard depends on streamlit, whose dynamic API is not fully typed.
# Keep application type checks actionable instead of maintaining local stub trees.
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = [
  "B101", # assert_used in tests
  "B105", # false positive: Redis key prefixes and session-state token keys flagged as hardcoded passwords
  "B107", # false positive: token: str = "" optional-param default flagged as hardcoded password
  "B404", # false positive: CI scripts use subprocess to run controlled commands (docker, alembic, aws)
  "B603", # false positive: subprocess.run with list args is safe; CI scripts don't use shell=True
]
