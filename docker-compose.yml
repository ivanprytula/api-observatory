# Minimal MVP stack: db, redis, redpanda, ingestor
# Network model: All services (including Floci AWS emulator) share `api-obs` network
# for inter-service communication (e.g., ingestor → db, ingestor → redis).
# Host access: All services expose ports to 127.0.0.1 or 0.0.0.0 for local development.

services:
  db:
    build:
      context: ./infra/database
      dockerfile: Dockerfile
    container_name: api-obs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: api_observatory
    ports:
      - '5432:5432'
    volumes:
      - ./infra/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        reservations:
          cpus: '0.5'
          memory: '512M'
        limits:
          cpus: '1.0'
          memory: '1G'
    networks:
      - api-obs

  redis:
    image: redis:7-alpine
    container_name: api-obs-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: '0.1'
          memory: '128M'
        limits:
          cpus: '0.25'
          memory: '256M'
    networks:
      - api-obs

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: api-obs-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - '9092:9092'
      - '8082:8082'
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: '0.25'
          memory: '256M'
        limits:
          cpus: '0.5'
          memory: '512M'
    networks:
      - api-obs

  ingestor:
    build:
      context: .
    container_name: api-obs-ingestor
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/api_observatory
      KAFKA_BROKER_URL: redpanda:29092
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    volumes:
      - ./services/ingestor:/app/services/ingestor
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3)']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync+restart
          path: ./services/ingestor
          target: /app/services/ingestor
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        reservations:
          cpus: '0.25'
          memory: '256M'
        limits:
          cpus: '0.5'
          memory: '512M'
    networks:
      - api-obs

  nginx:
    image: nginx:1.27-alpine
    container_name: api-obs-nginx
    profiles: [https]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      ingestor:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/nginx-status']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: '0.1'
          memory: '64M'
        limits:
          cpus: '0.25'
          memory: '128M'
    networks:
      - api-obs

  trivy:
    image: aquasec/trivy:0.56.2
    container_name: api-obs-trivy
    profiles: [security]
    entrypoint: ["trivy"]
    command: ["--help"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.local-dev/tmp/trivy-cache:/root/.cache/trivy
    security_opt: [no-new-privileges:true]
    networks:
      - api-obs

  # Floci Docker service (optional; started manually via: just floci-start)
  # Docker-based Floci is more universal (works on older CPUs that lack x86-64-v3 support)
  # To use docker-compose instead, uncomment and run: docker compose --profile aws up -d floci
  floci:
    image: floci/floci:latest
    container_name: api-obs-floci
    profiles: [aws]
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      FLOCI_DEFAULT_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      FLOCI_DEFAULT_AVAILABILITY_ZONE: ${AWS_AVAILABILITY_ZONE:-us-east-1a}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./.local-dev/tmp/floci-data:/tmp/floci
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_floci/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: '0.1'
          memory: '128M'
        limits:
          cpus: '0.5'
          memory: '512M'
    networks:
      - api-obs

# ─── NETWORK ────────────────────────────────────────────────────────────────
# All services (microservices + infrastructure emulators) share this network
# for inter-container communication.
#
# Services on `api-obs`:
#   - db (PostgreSQL)
#   - redis (cache)
#   - redpanda (message broker)
#   - ingestor (FastAPI microservice)
#   - nginx (HTTPS proxy, optional via --profile https)
#   - floci (AWS emulator, optional via --profile aws)
#
# Host access: Each service exposes ports to 127.0.0.1 or 0.0.0.0 for localhost access.
#   Port mappings:
#   - db:5432 → localhost:5432
#   - redis:6379 → localhost:6379
#   - redpanda:9092 (Kafka), 8082 (HTTP) → localhost:9092, 8082
#   - ingestor:8000 → localhost:8000
#   - nginx:80, 443 → localhost:80, 443 (HTTPS via nginx)
#   - floci:4566 → 127.0.0.1:4566 (local only)
networks:
  api-obs:
    driver: bridge
