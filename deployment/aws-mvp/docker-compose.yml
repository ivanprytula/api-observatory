services:
  ingestor-db:
    image: dhi.io/pgvector:0.8-pg17-debian13-dev@sha256:bebc78fa7124cf0cc1e38233d87197606aea45e288ec68841a84ae9f3300b529
    env_file: .runtime/ingestor-db.env
    environment: {POSTGRES_DB: api_obs_ingestor, POSTGRES_USER: postgres}
    volumes:
      - /mnt/ebs/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 10s
      timeout: 3s
      retries: 6
  ingestor:
    image: "${INGESTOR_IMAGE:?Set an immutable ingestor image}"
    env_file: .runtime/ingestor.env
    environment:
      SERVICE_VERSION: "${SERVICE_VERSION:?Set tree identity}"
    depends_on: {ingestor-db: {condition: service_healthy}}
    ports: [127.0.0.1:8000:8000]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
  cache:
    image: "${CACHE_IMAGE:?Set an immutable cache image}"
    env_file: .runtime/cache.env
    command: [sh, -c, "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
