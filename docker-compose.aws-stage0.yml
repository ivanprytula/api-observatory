# AWS Stage 0: three immutable application images on an EC2 Compose host.
# Runtime values are supplied by infra-owned .env delivery. This file deliberately
# has no build directives or local dependency containers.
# Run these forward-only commands before starting replacement containers. They use
# the same immutable images as the rollout and are intentionally not services.
x-stage0-migrations:
  ingestor: docker compose run --rm --no-deps ingestor alembic upgrade head
  inference: docker compose run --rm --no-deps inference alembic upgrade head

services:
  ingestor:
    image: ${INGESTOR_IMAGE:?Set INGESTOR_IMAGE to an immutable ECR digest}
    env_file: .env
    environment:
      INFERENCE_URL: http://inference:8001
      SERVICE_VERSION: ${SERVICE_VERSION:?Set SERVICE_VERSION to the deployed tree identity}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  inference:
    image: ${INFERENCE_IMAGE:?Set INFERENCE_IMAGE to an immutable ECR digest}
    env_file: .env
    environment:
      DATABASE_URL: ${INFERENCE_DATABASE_URL:?Set INFERENCE_DATABASE_URL for the dedicated inference database}
      SERVICE_VERSION: ${SERVICE_VERSION:?Set SERVICE_VERSION to the deployed tree identity}
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  dashboard:
    image: ${DASHBOARD_IMAGE:?Set DASHBOARD_IMAGE to an immutable ECR digest}
    env_file: .env
    environment:
      INFERENCE_URL: http://inference:8001
      SERVICE_VERSION: ${SERVICE_VERSION:?Set SERVICE_VERSION to the deployed tree identity}
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
