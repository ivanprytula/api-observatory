repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^infra/kubernetes/charts/.*/templates/.*\.ya?ml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: >-
          (?x)^(
            tests/fixtures_shared\.py|
            tests/unit/__init__\.py|
            tests/integration/__init__\.py|
            tests/shared/.*
          )$
      - id: requirements-txt-fixer
        files: ^requirements-audit\.txt$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix", "--config=pyproject.toml", "services", "libs", "scripts", "tests"]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "services", "libs", "scripts"]
        additional_dependencies: ["bandit[toml]"]
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
        - id: pip-audit
          name: pip-audit (wrapper)
          entry: uv run python scripts/ci/pip_audit_wrapper.py
          language: system
          files: 'pyproject\\.toml|uv\\.lock|requirements-audit\\.txt'
          pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint-cli2.jsonc, --fix]
        files: \.(md|markdown)$
        exclude: ^(\.venv/|\.remember/|node_modules/|vendor/|\.claude/|\.kilo/|\.codex/|\.cursor/|\.windsurf/|\.github/copilot/)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [--config, .markdown-link-check.json]
        files: \.(md|markdown)$
        exclude: ^docs/_archive/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: hadolint dockerfile lint
        args: [--failure-threshold, warning]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks secrets scan

  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: uv run ty check services libs
        language: system
        types: [python]
        pass_filenames: false
      - id: check-test-markers
        name: check test markers
        entry: uv run python scripts/ci/check_test_markers.py
        language: system
        types: [python]
        pass_filenames: false
      - id: private-docs-safeguard
        name: private-docs-safeguard
        entry: ./scripts/ci/02-pre-commit-private-docs.sh
        language: script
        types: [file]
        pass_filenames: false
      - id: check-workspace-and-boundaries
        name: check workspace and service boundaries
        entry: uv run python scripts/ci/preflight_checks.py
        language: system
        pass_filenames: false
      - id: docs-quality-markdown
        name: docs-quality-markdown
        entry: uv run python scripts/ci/docs_quality_check.py --profile precommit
        language: system
        types: [markdown]
        pass_filenames: true

  - repo: local
    hooks:
      - id: check-contracts-version
        name: Check contracts VERSION/CHANGELOG when contracts change
        entry: uv run python scripts/bump_contracts_version.py --check
        language: system
        files: ^libs/contracts/.*\.py$
        stages: [manual]

ci:
  autofix_commit_msg: "chore: auto-fix pre-commit hooks"
  autofix_prs: true
  skip: [pip-audit]
