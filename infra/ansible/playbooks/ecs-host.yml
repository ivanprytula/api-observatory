---
# Configure an EC2 host as an ECS container instance (Fargate but requires ecs-agent).
# This playbook is for EC2 launch type or ECS Anywhere.
#
# Usage:
#   ansible-playbook playbooks/ecs-host.yml -i inventory/aws_ec2.yml \
#     --limit tag_Environment_dev --ask-become-pass --ask-vault-pass

- name: 'Configure ECS container instance'
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: 'Verify minimum Ansible version'
      ansible.builtin.assert:
        fail_msg: 'Ansible 2.15+ is required.'
        that:
          - 'ansible_version.full is version("2.15", ">=")'

  roles:
    - role: 'common'
    - role: 'docker'
    - role: 'ecs_agent'
    - role: 'monitoring'
