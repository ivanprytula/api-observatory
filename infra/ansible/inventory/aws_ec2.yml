---
# Dynamic AWS EC2 inventory.
#
# Usage:
#   ansible-inventory -i inventory/aws_ec2.yml --list
#   ansible-playbook playbooks/provision-ec2.yml -i inventory/aws_ec2.yml --limit dev --ask-become-pass
#
# Prerequisites:
#   - pip install 'ansible[aws]'  (or: ansible-galaxy collection install amazon.aws)
#   - AWS credentials (env vars, ~/.aws/credentials, or aws-vault)

plugin: amazon.aws.aws_ec2
regions:
  - eu-central-1
filters:
  tag:Project: data-zoo
  instance-state-name: running
keyed_groups:
  - key: tags.Environment
    prefix: env
    separator: ''
  - key: tags.Role
    prefix: role
    separator: ''
compose:
  ansible_host: private_ip_address
hostnames:
  - private-ip-address
