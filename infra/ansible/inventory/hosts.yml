---
# Static inventory for api-observatory.
# Replace IP addresses / hostnames with real values before use.
# For Azure VMs, use azure.azcollection.azure_rm dynamic inventory or fill in IPs below.

all:
  children:

    # Local development — runs Ansible against the current machine
    dev:
      hosts:
        localhost:
          ansible_connection: local

    # Azure VM (fill in after provisioning)
    azure_dev:
      hosts:
        api-observatory-vm:
          ansible_host: '<VM_PUBLIC_IP>'
          ansible_user: 'azureuser'
          ansible_ssh_private_key_file: '~/.ssh/id_rsa'

    # Production environment (add hosts here before going live)
    production:
      hosts: {}
