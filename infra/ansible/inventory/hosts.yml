---
# Static inventory for api-observatory.
# Replace IP addresses / hostnames with real values before use.
# For cloud targets, prefer a dynamic inventory plugin (e.g., amazon.aws.aws_ec2).

all:
  children:

    # Local development — runs Ansible against the current machine
    dev:
      hosts:
        localhost:
          ansible_connection: local

    # Staging environment
    staging:
      hosts:
        staging-01:
          ansible_host: '10.0.1.10'
          ansible_user: 'ubuntu'

    # Production environment (add hosts here before going live)
    production:
      hosts: {}
