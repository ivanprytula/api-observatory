# Disposable local values, not production credentials.
apiVersion: v1
kind: Secret
metadata:
  name: api-obs-app-secrets
  labels:
    app.kubernetes.io/part-of: api-obs
type: Opaque
stringData:
  database_url: >-
    postgresql+asyncpg://postgres:postgres@ingestor-db:5432/api_obs_ingestor
  postgres_password: postgres
  jwt_secret: >-
    local-k3d-jwt-placeholder-not-for-production-0001
  internal_jwt_secret: >-
    local-k3d-internal-jwt-placeholder-not-for-production-0001
