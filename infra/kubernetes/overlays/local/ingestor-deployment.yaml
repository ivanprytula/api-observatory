apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  labels:
    app.kubernetes.io/name: ingestor
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: api-obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: api-obs
    spec:
      serviceAccountName: api-obs-app
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestor
          image: api-obs-registry:5000/api-obs/ingestor:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-obs-app-secrets
                  key: database_url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-obs-app-secrets
                  key: jwt_secret
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-obs-app-secrets
                  key: internal_jwt_secret
            - name: ENVIRONMENT
              value: local-k3d
            - name: SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: api-obs-app-config
                  key: service_version
            - name: TRUSTED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: api-obs-app-config
                  key: trusted_hosts
            - name: CACHE_ENABLED
              value: "false"
            - name: BROKER_ENABLED
              value: "false"
            - name: OPENAI_ENABLED
              value: "false"
            - name: ANTHROPIC_ENABLED
              value: "false"
            - name: OTEL_ENABLED
              value: "false"
            - name: LOG_FORMAT
              value: json
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: ingestor
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: ingestor
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: ingestor
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
