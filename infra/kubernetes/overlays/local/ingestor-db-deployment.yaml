apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-db
  labels:
    app.kubernetes.io/name: ingestor-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: api-obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: api-obs
    spec:
      serviceAccountName: api-obs-app
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: api-obs-registry:5000/api-obs/ingestor-db:local
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: api_obs_ingestor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-obs-app-secrets
                  key: postgres_password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - api_obs_ingestor
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - api_obs_ingestor
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: api-obs-postgres-init
