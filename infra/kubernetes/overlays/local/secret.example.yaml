# Local dev only — placeholder values. Production secrets come from Azure Key Vault via the
# infra repo (see docs/07-deployment/app-repo-contract.md "Secret Source in Production").
apiVersion: v1
kind: Secret
metadata:
  name: data-zoo-app-secrets
type: Opaque
stringData:
  database_url: postgresql+asyncpg://postgres:postgres@postgresql:5432/data_pipeline
  broker_url: redpanda:9092
  jwt_secret: change-me-local-sandbox
  encryption_key: change-me-local-sandbox
