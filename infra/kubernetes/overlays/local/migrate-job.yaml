# Applied by the local lab after ingestor-db is ready and before application
# deployments.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingestor-migrate
  namespace: api-obs
  labels:
    app.kubernetes.io/name: ingestor-migrate
    app.kubernetes.io/part-of: api-obs
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor-migrate
        app.kubernetes.io/part-of: api-obs
    spec:
      serviceAccountName: api-obs-app
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: api-obs-registry:5000/api-obs/ingestor:local
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-obs-app-secrets
                  key: database_url
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
