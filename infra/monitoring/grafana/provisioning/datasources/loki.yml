apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Logs -> traces: extract trace_id from the JSON log line and link it
      # to the Tempo datasource ($$ escapes Grafana's env-var interpolation).
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'View trace'
