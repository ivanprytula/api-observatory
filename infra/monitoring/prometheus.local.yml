global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    project: api-observatory

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # NOTE: The dashboard service (Streamlit) is intentionally NOT a scrape
  # target. It is a metrics *consumer* — it fetches /metrics from the
  # ingestor and parses them for display — not a metrics *exporter*.
  # Streamlit does not natively expose a /metrics endpoint, so scraping it
  # would always result in "down" targets and 404 errors.

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ingestor
    static_configs:
      - targets: ['ingestor:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: ingestor

  - job_name: inference
    static_configs:
      - targets: ['inference:8001']
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: inference

  - job_name: broker
    static_configs:
      - targets: ['broker:9644']
    metrics_path: /metrics
    scrape_interval: 15s
