name: api-observatory
type: async-fastapi-monorepo
description: >
  Monorepo for an async FastAPI data platform centered on services/ingestor,
  with shared libraries, Alembic migrations, and additional service workspaces.

skills:
  local:
    - add-educational-comments
    - architecture-blueprint-generator
    - async-patterns
    - autoresearch
    - postgresql-code-review
    - postgresql-optimization

instruction_overrides:
  - fastapi.instructions.md
  - fastapi-testing.instructions.md
  - models.instructions.md
  - pydantic.instructions.md
  - tests.instructions.md
  - security-and-owasp.instructions.md

conventions:
  primary_service: services/ingestor
  shared_library_root: libs/platform
  library_boundary_rule: libs/* must not import from services/*
  schema_source_of_truth: alembic
  python_command_prefix: uv run
  lockfile: uv.lock
  tests:
    unit_and_integration_roots:
      - tests/
      - services/ingestor/tests/
    default_style: focused tests for touched slices
  docs:
    root: docs/
    adr_root: docs/adr/

memory:
  repo_context: .copilot/memories/repo-context.md
  decisions: docs/adr/

hooks:
  project_hook_root: .github/hooks/
  available:
    - governance-audit
    - secrets-scanner
    - tool-guardian

stack:
  language: Python 3.14
  framework: FastAPI + Uvicorn
  database: PostgreSQL 17 + SQLAlchemy 2.0 async + asyncpg
  migrations: Alembic
  cache: Redis
  event_streaming: aiokafka
  observability: Prometheus + OpenTelemetry + Sentry
  packaging: uv + pyproject.toml
  linting: Ruff
  type_checking: ty
  testing: pytest + pytest-asyncio + aiosqlite + testcontainers
  automation: GitHub Actions + pre-commit
